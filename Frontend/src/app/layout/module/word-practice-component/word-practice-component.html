<div class="main-container">
  <mat-card class="app-card webcam-card">
    <div class="webcam-frame">
      <video #videoElement class="webcam-video" autoplay muted></video>
      <canvas #canvasElement style="display: none;"></canvas>
      <div class="buffer-bar">
        <mat-progress-bar
          mode="determinate"
          [value]="bufferProgress"
          [color]="isReady ? 'primary' : 'accent'">
        </mat-progress-bar>
      </div>
    </div>
  </mat-card>

  <div class="info-column">
    <mat-card class="app-card title-card">
      <div class="card-header">
        <div class="icon-circle">
          <mat-icon class="card-icon">sign_language</mat-icon>
        </div>
        <h2 class="card-title">Pratica de Palavras</h2>
      </div>
      <mat-card-content class="title-content">
        <p class="instruction-text">Faca o sinal para a palavra</p>
        <h1 class="target-word" [class.correct]="isCorrect">{{ targetWord }}</h1>
        <p class="score-text">Pontuacao: {{ score }}</p>
        <button mat-stroked-button (click)="selectRandomWord()" class="skip-button">
          <mat-icon>skip_next</mat-icon>
          Pular palavra
        </button>
      </mat-card-content>
    </mat-card>

    <mat-card class="app-card feedback-card">
      <mat-card-content class="feedback-content">
        <div class="info-item">
          <mat-icon class="info-icon" color="primary">forum</mat-icon>
          <p class="feedback-text">{{ feedbackMessage }}</p>
        </div>
        <div class="info-item" *ngIf="predictions && predictions.length > 0">
          <mat-icon class="info-icon" color="primary">insights</mat-icon>
          <div>
            <p class="confidence-text" *ngFor="let pred of predictions">
              #{{ pred.rank }} {{ pred.word }} - {{ (pred.confidence * 100).toFixed(1) }}%
            </p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
