[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libras"
version = "0.1.0"
description = "Reconhecimento de palavras em Libras com MediaPipe + LSTM"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy==1.23.5",
    "tensorflow==2.12.0",
    "mediapipe==0.10.9",
    "opencv-python==4.8.1.78",
    "protobuf==3.20.3",
    "scikit-learn==1.3.2",
    "scipy==1.15.3",
    "matplotlib==3.7.5",
    "seaborn==0.13.2",
    "pandas==2.3.3",
    "tqdm==4.66.4",
    "PyYAML==6.0.1",
    "kagglehub==0.2.9",
]

[project.optional-dependencies]
api = [
    "Flask==3.0.3",
    "Flask-Cors==4.0.1",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Bcrypt==1.0.1",
]
dev = [
    "pytest==8.3.3",
]

[tool.setuptools.packages.find]
where = ["src"]
