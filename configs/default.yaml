dataset:
  kaggle_id: "davimedio01/v-librasil"
  max_classes: 50
  # Pasta de keypoints processados usada pelo treino/avaliacao. null usa o
  # padrao (data/processed/, saida do 02_preprocess.py sobre o V-LIBRASIL).
  # O vocabulario custom (scripts/06_record_dataset.py + 07_preprocess_custom.py)
  # fica em data/processed_custom/.
  processed_dir: "data/processed_custom"

preprocess:
  num_frames: 30
  keypoint_dim: 438  # libras.utils.mediapipe_holistic.TOTAL_DIM (pose + face reduzida + maos)
  mediapipe:
    detection_confidence: 0.5
    tracking_confidence: 0.5
    model_complexity: 1

training:
  batch_size: 16
  epochs: 200
  test_size: 0.15
  val_size: 0.15
  random_seed: 42
  learning_rate: 0.001
  augmentation:
    enabled: true
    multiplier: 10         # ← MUDOU (era 5) — mais augmentation
  callbacks:
    early_stopping_patience: 30
    reduce_lr_patience: 10
    reduce_lr_factor: 0.5
    min_lr: 1.0e-6

inference:
  threshold: 0.70
  stability_window: 10
  top_n_display: 5
  predict_interval: 5
  activity_threshold: 0.01

feedback:
  error_threshold: 0.05